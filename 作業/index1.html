<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水與生活：小小科學探索日</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            background-color: #f0f8ff;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.1);
            border-top: 6px solid #0077b6;
        }
        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px dashed #caf0f8;
            margin-bottom: 25px;
        }
        h1 {
            color: #0077b6;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #00b4d8;
            font-size: 1.1rem;
            font-weight: 500;
        }
        section {
            margin-bottom: 24px;
        }
        h2 {
            color: #023e8a;
            font-size: 1.25rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        h2::before {
            content: "💧";
            margin-right: 8px;
            font-size: 1rem;
        }
        p {
            margin-bottom: 8px;
            font-size: 1rem;
            color: #4a5568;
        }
        ul {
            list-style-type: disc;
            padding-left: 24px;
            color: #4a5568;
        }
        li {
            margin-bottom: 6px;
        }
        .slogan {
            background-color: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin: 12px 0;
            font-weight: bold;
            color: #0369a1;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>水與生活：小小科學探索日</h1>
            <p class="subtitle">一起從生活中的水，發現科學的有趣之處。</p>
        </header>

        <main>
            <section>
                <h2>活動介紹</h2>
                <p>這次活動適合國小中年級學生，請帶著好奇心一起參加。</p>
            </section>

            <section>
                <h2>觀察水的樣子</h2>
                <p>看看不同容器中的水，試著說出你觀察到的變化。</p>
            </section>

            <section>
                <h2>認識水的名字</h2>
                <p>水的化學式是 H<sub>2</sub>O。</p>
            </section>

            <section>
                <h2>參加前的小提醒</h2>
                <ul>
                    <li>請自備水壺，並準備一本觀察筆記。</li>
                    <li>我們將使用面積為 100 cm<sup>2</sup> 的方形觀察卡。</li>
                </ul>
                <div class="slogan">
                    今天的探索口號是：先觀察，再提問！
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 小小科學探索日團隊</p>
        </footer>
    </div>

</body>
</html>
